# File: /etc/dhcp/dhcpd.conf
default-lease-time 300;       # <--- THAY ĐỔI: Thời gian thuê mặc định (giây)
max-lease-time 86400;         # <--- THAY ĐỔI: Thời gian thuê tối đa (giây)
authoritative;

subnet 10.0.0.0 netmask 255.0.0.0 {   # <--- THAY ĐỔI: Địa chỉ mạng và netmask theo đề bài
    option routers 10.0.0.254;         # <--- THAY ĐỔI: Địa chỉ Gateway cấp cho Client
    option subnet-mask 255.0.0.0;
    option domain-name "dhcnhn.com";   # <--- THAY ĐỔI: Tên miền của hệ thống
    option domain-name-servers 10.0.0.2; # <--- THAY ĐỔI: IP máy chủ DNS
    range 10.0.0.100 10.0.0.200;       # <--- THAY ĐỔI: Dải IP cấp phát động

    # Cấp cố định theo địa chỉ MAC
    host may-giang-vien {
        hardware ethernet 00:0c:29:aa:bb:cc;  # <--- THAY ĐỔI: Điền địa chỉ MAC của card mạng máy cần gán
        fixed-address 10.0.0.5;                # <--- THAY ĐỔI: Địa chỉ IP cố định muốn cấp
    }

    # Bộ lọc từ chối cấp IP
    host may-bi-chan {
        hardware ethernet 22:22:22:22:22:22;  # <--- THAY ĐỔI: Điền địa chỉ MAC muốn chặn
        deny booting;
    }
}
