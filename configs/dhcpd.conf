# File: /etc/dhcp/dhcpd.conf
default-lease-time 900;       # SỬA: Thời gian thuê mặc định (giây) - Đề cho phút thì nhân 60
max-lease-time 95040;         # SỬA: Thời gian thuê tối đa (giây) - Đề cho ngày thì nhân 86400
authoritative;

subnet 10.0.0.0 netmask 255.0.0.0 {
    option routers 10.0.0.254;
    option subnet-mask 255.0.0.0;
    option domain-name "dhcnhn.com";
    option domain-name-servers 10.0.0.2;

    range 10.0.0.100 10.0.0.200;       # SỬA: Dải IP cấp phát theo đề

    # Trường hợp đề yêu cầu GÁN CỐ ĐỊNH theo MAC
    host may-co-dinh {
        hardware ethernet 11:11:11:11:11:11;  # SỬA: MAC máy
        fixed-address 10.0.0.5;                # SỬA: IP cố định
    }

    # Trường hợp đề yêu cầu CHẶN / TỪ CHỐI cấp theo MAC
    host may-bi-chan {
        hardware ethernet 22:22:22:22:22:22;  # SỬA: MAC cần chặn
        deny booting;
    }
}
