# Cấu hình Virtual Hosts cho Apache2
# File: /etc/apache2/sites-available/googlehaui.com.conf
<VirtualHost *:80>
    ServerName googlehaui.com                 # <--- THAY ĐỔI: Tên miền chính của website
    ServerAlias www.googlehaui.com             # <--- THAY ĐỔI: Bí danh (alias) tên miền
    DocumentRoot /var/www/googlehaui.com       # <--- THAY ĐỔI: Đường dẫn thư mục chứa mã nguồn web
    ErrorLog ${APACHE_LOG_DIR}/googlehaui_error.log
    CustomLog ${APACHE_LOG_DIR}/googlehaui_access.log combined
</VirtualHost>

