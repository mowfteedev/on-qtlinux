# File: /etc/apache2/sites-available/googlehaui.com.conf
<VirtualHost *:80>
    ServerName googlehaui.com                 # SỬA: Tên miền chính theo đề
    ServerAlias www.googlehaui.com             # SỬA: Bí danh (alias) nếu đề yêu cầu
    DocumentRoot /var/www/googlehaui.com       # SỬA: Thư mục chứa mã nguồn web
    ErrorLog ${APACHE_LOG_DIR}/googlehaui_error.log
    CustomLog ${APACHE_LOG_DIR}/googlehaui_access.log combined
</VirtualHost>
