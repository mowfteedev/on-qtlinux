# Thêm vào cuối /etc/samba/smb.conf
[share]                               # <--- THAY ĐỔI: Tên thư mục chia sẻ hiển thị trên mạng
   comment = Thu muc chia se chung cho GV va SV
   path = /srv/share                  # <--- THAY ĐỔI: Đường dẫn thư mục cục bộ trên máy chủ Linux
   read only = no                     # <--- THAY ĐỔI: no là cho phép ghi, yes là chỉ cho đọc
   browsable = yes
   guest ok = yes                     # <--- THAY ĐỔI: yes là cho phép truy cập khách không cần mật khẩu
   create mask = 0775
   directory mask = 0775
